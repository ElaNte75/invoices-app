<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Παραγγελίες</title>
<meta name="theme-color" content="#0b6e5f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Layout: μία οθόνη κινητού, επιλογή πελάτη και κατηγορίας σε μεγάλες λίστες, μεγάλες καρτέλες κάτω, κουμπί αποστολής πάνω από τις καρτέλες */
:root {
  --bg: #eef1f2;
  --surface: #ffffff;
  --ink: #172126;
  --muted: #5d6b72;
  --line: #d5dcdf;
  --accent: #0b6e5f;
  --accent-ink: #ffffff;
  --soft: #dcefeb;
  --warn: #f2c14e;
  --warn-ink: #3b2c00;
  --font-display: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Source Sans 3", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11181b; --surface: #1b2529; --ink: #e8eef0; --muted: #98a8af; --line: #2f3d43;
    --accent: #2fb59f; --accent-ink: #06201b; --soft: #1b3a35; --warn: #e0b240; --warn-ink: #2a2000;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11181b; --surface: #1b2529; --ink: #e8eef0; --muted: #98a8af; --line: #2f3d43;
  --accent: #2fb59f; --accent-ink: #06201b; --soft: #1b3a35; --warn: #e0b240; --warn-ink: #2a2000;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 18px;
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 190px;
  height: auto; min-height: 100%;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.demo { background: var(--warn); color: var(--warn-ink); font-size: 14px; padding: 6px 12px; margin-inline: -16px; text-align: center; }
h1 { font-family: var(--font-display); font-size: 28px; margin: 14px 0 10px; letter-spacing: .01em; }
.label { font-family: var(--font-display); font-size: 14px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 14px 0 8px; }

.pick { width: 100%; min-height: 68px; border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: left; font-family: var(--font-display); font-size: 24px; font-weight: 600; }
.pick span { min-width: 0; overflow-wrap: anywhere; }
.pick.empty { color: var(--muted); font-weight: 500; }
.pick.set { border-color: var(--accent); background: var(--soft); }
.pick::after { content: "▾"; font-size: 24px; color: var(--muted); flex: none; }

.rows { display: flex; flex-direction: column; gap: 10px; }
.row { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.row.has { border-color: var(--accent); background: var(--soft); }
.name { font-family: var(--font-display); font-size: 22px; font-weight: 600; line-height: 1.15; }
.sub { font-size: 14px; color: var(--muted); }
.step { display: flex; align-items: center; gap: 8px; }
.step button { width: 60px; height: 60px; flex: none; border-radius: 10px; border: 2px solid var(--line); background: var(--surface); font-size: 32px; line-height: 1; font-family: var(--font-display); font-weight: 700; }
.step button.plus { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.step input { flex: 1; min-width: 0; height: 60px; text-align: center; border: 2px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); font-family: var(--font-display); font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums; }
.step .unit { color: var(--muted); font-size: 14px; width: 34px; flex: none; }
.empty-note { color: var(--muted); padding: 14px 4px; }

.search { width: 100%; min-height: 56px; border: 2px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); font: inherit; padding: 0 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
.card dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 10px 0 0; }
.card dt { color: var(--muted); }
.card dd { margin: 0; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }

.day { font-family: var(--font-display); font-size: 20px; font-weight: 700; margin: 14px 0 6px; }
.order { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; }
.order b { font-family: var(--font-display); font-size: 20px; }
.order ul { margin: 6px 0 0; padding-left: 20px; }
.status { float: right; font-size: 14px; background: var(--soft); border-radius: 20px; padding: 2px 10px; }

.dock { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 10px max(16px, env(safe-area-inset-left, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 10px; }
.send { min-height: 62px; border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font-family: var(--font-display); font-size: 24px; font-weight: 700; letter-spacing: .02em; }
.send:disabled { background: var(--line); color: var(--muted); }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.tab { min-height: 68px; border: 2px solid var(--line); background: var(--bg); border-radius: 12px; font-family: var(--font-display); font-size: 20px; font-weight: 600; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 200px; background: var(--ink); color: var(--bg); padding: 12px 20px; border-radius: 30px; font-weight: 600; max-width: 90%; text-align: center; z-index: 30; }

.sheet { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: flex; flex-direction: column; padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-left, 0px)) env(safe-area-inset-bottom, 0px) max(16px, env(safe-area-inset-right, 0px)); }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0 10px; }
.sheet-head h2 { font-family: var(--font-display); font-size: 26px; margin: 0; }
.close { min-height: 52px; padding: 0 18px; border: 2px solid var(--line); border-radius: 10px; background: var(--surface); font-family: var(--font-display); font-size: 20px; font-weight: 600; }
.sheet-list { flex: 1; overflow-y: auto; margin-top: 10px; display: flex; flex-direction: column; gap: 8px; padding-bottom: 16px; }
.opt { min-height: 64px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 16px; font-family: var(--font-display); font-size: 22px; font-weight: 600; flex: none; }
.opt[aria-current="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
@media (prefers-reduced-motion: no-preference) { .row, .pick, .tab { transition: background .15s, border-color .15s; } }
:root { color-scheme: light; }
[hidden] { display: none !important; }
body { padding-top: env(safe-area-inset-top, 0px); }
.install { width: 100%; min-height: 68px; margin-top: 12px; border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font-family: var(--font-display); font-size: 24px; font-weight: 700; }
</style>
</head>
<body>

<div class="demo">Δοκιμαστική οθόνη · τα ονόματα και τα στοιχεία είναι παραδείγματα · έκδοση 1</div>
<button class="install" id="install" hidden>Εγκατάσταση εφαρμογής</button>

<section id="v-order">
  <h1>Νέα παραγγελία</h1>
  <div class="label">Πελάτης</div>
  <button class="pick empty" id="pickClient"><span>Διάλεξε πελάτη</span></button>
  <div class="label">Κατηγορία προϊόντων</div>
  <button class="pick empty" id="pickCat"><span>Διάλεξε κατηγορία</span></button>
  <div class="label" id="prodLabel">Προϊόντα</div>
  <div class="rows" id="orderRows"></div>
</section>

<section id="v-info" hidden>
  <h1>Πληροφορίες προϊόντων</h1>
  <input class="search" id="q" type="search" placeholder="Αναζήτηση (π.χ. 60×40)" aria-label="Αναζήτηση προϊόντος">
  <div class="rows" id="infoRows" style="margin-top:12px"></div>
</section>

<section id="v-hist" hidden>
  <h1>Ιστορικό</h1>
  <div id="histList"></div>
</section>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-head"><h2 id="sheetTitle"></h2><button class="close" id="sheetClose">Κλείσιμο</button></div>
  <input class="search" id="sheetQ" type="search" placeholder="Γράψε για αναζήτηση" aria-label="Αναζήτηση στη λίστα">
  <div class="sheet-list" id="sheetList"></div>
</div>

<div class="toast" id="toast" hidden></div>

<div class="dock">
  <button class="send" id="send" disabled>Αποστολή παραγγελίας</button>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-v="order" aria-selected="true">Παραγγελία</button>
    <button class="tab" role="tab" data-v="info" aria-selected="false">Πληροφορίες</button>
    <button class="tab" role="tab" data-v="hist" aria-selected="false">Ιστορικό</button>
  </div>
</div>

<script>
/* Παραδείγματα: 104 πελάτες από συνδυασμούς τύπου και ονόματος */
var TYPES = ["Ταβέρνα", "Ψητοπωλείο", "Φούρνος", "Καφέ", "Εστιατόριο", "Ζαχαροπλαστείο", "Μεζεδοπωλείο", "Ουζερί"];
var NAMES = ["Γιώργος", "Νίκος", "Μαρία", "Αγορά", "Ελένη", "Δημήτρης", "Κώστας", "Αθηνά", "Πλατεία", "Ήλιος", "Στέλιος", "Λιμάνι", "Σοφία"];
var CLIENTS = [];
for (var i = 0; CLIENTS.length < 104; i++) {
  var c = TYPES[i % TYPES.length] + " " + NAMES[(i * 5 + Math.floor(i / 8)) % NAMES.length];
  if (CLIENTS.indexOf(c) < 0) CLIENTS.push(c);
}
CLIENTS.sort(function (a, b) { return a.localeCompare(b, "el"); });

var CATS = ["Ταψιά", "Λαμαρίνες", "Κατσαρόλες", "Ταψιά γαστρονομίας", "Σκεύη κουζίνας"];
var PRODUCTS = [
  { id: 1, cat: "Ταψιά", name: "Ταψί 60×40", info: { "Διάσταση": "60×40 cm", "Πάχος": "0,8 mm", "Υλικό": "Αλουμίνιο", "Τιμή": "12,50 €" } },
  { id: 2, cat: "Ταψιά", name: "Ταψί 50×35", info: { "Διάσταση": "50×35 cm", "Πάχος": "0,7 mm", "Υλικό": "Αλουμίνιο", "Τιμή": "9,80 €" } },
  { id: 3, cat: "Ταψιά", name: "Ταψί 38×28", info: { "Διάσταση": "38×28 cm", "Πάχος": "0,6 mm", "Υλικό": "Αλουμίνιο", "Τιμή": "6,20 €" } },
  { id: 4, cat: "Λαμαρίνες", name: "Λαμαρίνα φούρνου 60×40", info: { "Διάσταση": "60×40 cm", "Πάχος": "1,0 mm", "Υλικό": "Γαλβανιζέ", "Τιμή": "8,90 €" } },
  { id: 5, cat: "Λαμαρίνες", name: "Λαμαρίνα φούρνου 45×32", info: { "Διάσταση": "45×32 cm", "Πάχος": "1,0 mm", "Υλικό": "Γαλβανιζέ", "Τιμή": "6,40 €" } },
  { id: 6, cat: "Κατσαρόλες", name: "Κατσαρόλα 32", info: { "Διάμετρος": "32 cm", "Πάχος": "2,0 mm", "Υλικό": "Inox", "Τιμή": "34,00 €" } },
  { id: 7, cat: "Κατσαρόλες", name: "Κατσαρόλα 28", info: { "Διάμετρος": "28 cm", "Πάχος": "2,0 mm", "Υλικό": "Inox", "Τιμή": "26,50 €" } },
  { id: 8, cat: "Κατσαρόλες", name: "Κατσαρόλα 24", info: { "Διάμετρος": "24 cm", "Πάχος": "1,8 mm", "Υλικό": "Inox", "Τιμή": "19,90 €" } },
  { id: 9, cat: "Ταψιά γαστρονομίας", name: "GN 1/1 – 65 mm", info: { "Διάσταση": "53×32,5 cm", "Βάθος": "65 mm", "Υλικό": "Inox", "Τιμή": "14,20 €" } },
  { id: 10, cat: "Ταψιά γαστρονομίας", name: "GN 1/2 – 65 mm", info: { "Διάσταση": "32,5×26,5 cm", "Βάθος": "65 mm", "Υλικό": "Inox", "Τιμή": "9,10 €" } },
  { id: 11, cat: "Σκεύη κουζίνας", name: "Σέσουλα μεγάλη", info: { "Μήκος": "35 cm", "Υλικό": "Inox", "Τιμή": "3,80 €" } },
  { id: 12, cat: "Σκεύη κουζίνας", name: "Τρυπητή σέσουλα", info: { "Μήκος": "35 cm", "Υλικό": "Inox", "Τιμή": "4,20 €" } }
];
var client = null, cat = null, qty = {}, sheetMode = null, history = [
  { day: "Χθες", client: "Φούρνος Μαρία", items: [["Ταψί 60×40", 60], ["Ταψί 50×35", 40]] },
  { day: "Χθες", client: "Ταβέρνα Γιώργος", items: [["Κατσαρόλα 32", 2]] }
];
var $ = function (id) { return document.getElementById(id); };

function setPick(btn, value, placeholder) {
  btn.className = "pick " + (value ? "set" : "empty");
  btn.firstChild.textContent = value || placeholder;
}
function totalQty() { return Object.keys(qty).reduce(function (s, k) { return s + qty[k]; }, 0); }
function updateSend() {
  var total = totalQty(), b = $("send");
  b.disabled = !client || !total;
  b.textContent = total ? "Αποστολή (" + total + " τεμ.)" : "Αποστολή παραγγελίας";
}
function drawOrder() {
  var list = PRODUCTS.filter(function (p) { return p.cat === cat; });
  $("prodLabel").textContent = cat ? "Προϊόντα · " + cat : "Προϊόντα";
  if (!cat) { $("orderRows").innerHTML = '<div class="empty-note">Διάλεξε πρώτα κατηγορία για να δεις τα προϊόντα.</div>'; updateSend(); return; }
  $("orderRows").innerHTML = list.map(function (p) {
    var n = qty[p.id] || 0;
    return '<div class="row' + (n ? " has" : "") + '" id="r' + p.id + '"><div class="name">' + p.name + '</div>' +
      '<div class="step"><button data-m="' + p.id + '" aria-label="Λιγότερο">−</button>' +
      '<input id="q' + p.id + '" data-i="' + p.id + '" type="text" inputmode="numeric" pattern="[0-9]*" value="' + n + '" aria-label="Ποσότητα ' + p.name + '">' +
      '<button class="plus" data-p="' + p.id + '" aria-label="Περισσότερο">+</button><span class="unit">τεμ.</span></div></div>';
  }).join("");
  updateSend();
}
function setQty(id, n) {
  n = Math.max(0, Math.min(99999, n || 0));
  if (n) qty[id] = n; else delete qty[id];
  var r = $("r" + id); if (r) r.classList.toggle("has", n > 0);
  updateSend();
}
function drawInfo() {
  var q = $("q").value.trim().toLowerCase();
  $("infoRows").innerHTML = PRODUCTS.filter(function (p) { return (p.name + " " + p.cat).toLowerCase().indexOf(q) > -1; }).map(function (p) {
    var dl = Object.keys(p.info).map(function (k) { return "<dt>" + k + "</dt><dd>" + p.info[k] + "</dd>"; }).join("");
    return '<div class="card"><div class="name">' + p.name + '</div><div class="sub">' + p.cat + "</div><dl>" + dl + "</dl></div>";
  }).join("") || '<div class="empty-note">Δεν βρέθηκε προϊόν.</div>';
}
function drawHist() {
  var out = "", last = "";
  history.forEach(function (o) {
    if (o.day !== last) { out += '<div class="day">' + o.day + "</div>"; last = o.day; }
    out += '<div class="order"><span class="status">' + (o.sent ? "Στάλθηκε" : "Πέρασε") + "</span><b>" + o.client + "</b><ul>" +
      o.items.map(function (i) { return "<li>" + i[0] + " × " + i[1] + "</li>"; }).join("") + "</ul></div>";
  });
  $("histList").innerHTML = out;
}
function toast(t) {
  var el = $("toast"); el.textContent = t; el.hidden = false;
  setTimeout(function () { el.hidden = true; }, 2600);
}
function show(v) {
  ["order", "info", "hist"].forEach(function (k) { $("v-" + k).hidden = k !== v; });
  document.querySelectorAll(".tab").forEach(function (t) { t.setAttribute("aria-selected", t.dataset.v === v); });
  $("send").hidden = v !== "order";
  document.body.style.paddingBottom = v === "order" ? "190px" : "120px";
  if (v === "info") drawInfo();
  if (v === "hist") drawHist();
}

function openSheet(mode) {
  sheetMode = mode;
  $("sheetTitle").textContent = mode === "client" ? "Πελάτης" : "Κατηγορία";
  $("sheetQ").value = "";
  $("sheetQ").parentNode.hidden = false;
  $("sheet").hidden = false;
  drawSheet();
}
function drawSheet() {
  var items = sheetMode === "client" ? CLIENTS : CATS, cur = sheetMode === "client" ? client : cat;
  var q = $("sheetQ").value.trim().toLowerCase();
  $("sheetList").innerHTML = items.filter(function (x) { return x.toLowerCase().indexOf(q) > -1; }).map(function (x) {
    return '<button class="opt" data-o="' + x + '"' + (x === cur ? ' aria-current="true"' : "") + ">" + x + "</button>";
  }).join("") || '<div class="empty-note">Δεν βρέθηκε.</div>';
}
function closeSheet() { $("sheet").hidden = true; }

document.addEventListener("click", function (e) {
  var t = e.target.closest("button"); if (!t) return;
  if (t.dataset.o) {
    if (sheetMode === "client") { client = t.dataset.o; setPick($("pickClient"), client, "Διάλεξε πελάτη"); }
    else { cat = t.dataset.o; setPick($("pickCat"), cat, "Διάλεξε κατηγορία"); drawOrder(); }
    closeSheet(); updateSend();
  }
  else if (t.id === "pickClient") openSheet("client");
  else if (t.id === "pickCat") openSheet("cat");
  else if (t.id === "sheetClose") closeSheet();
  else if (t.dataset.p) { var p = t.dataset.p; setQty(p, (qty[p] || 0) + 1); $("q" + p).value = qty[p] || 0; }
  else if (t.dataset.m) { var m = t.dataset.m; setQty(m, (qty[m] || 0) - 1); $("q" + m).value = qty[m] || 0; }
  else if (t.dataset.v) show(t.dataset.v);
  else if (t.id === "send") {
    var items = PRODUCTS.filter(function (p) { return qty[p.id]; }).map(function (p) { return [p.name, qty[p.id]]; });
    history.unshift({ day: "Σήμερα", client: client, items: items, sent: true });
    toast("Στάλθηκε: " + client);
    qty = {}; drawOrder();
  }
});
document.addEventListener("input", function (e) {
  var el = e.target;
  if (el.dataset && el.dataset.i) {
    var clean = el.value.replace(/\D/g, "").slice(0, 5);
    if (clean !== el.value) el.value = clean;
    setQty(el.dataset.i, parseInt(clean, 10) || 0);
  }
});
document.addEventListener("focusin", function (e) {
  if (e.target.dataset && e.target.dataset.i) e.target.select();
});
document.addEventListener("focusout", function (e) {
  if (e.target.dataset && e.target.dataset.i) e.target.value = qty[e.target.dataset.i] || 0;
});
$("q").addEventListener("input", drawInfo);
$("sheetQ").addEventListener("input", drawSheet);
drawOrder(); show("order");

var deferred = null;
function isStandalone() { return window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true; }
window.addEventListener("beforeinstallprompt", function (e) {
  e.preventDefault(); deferred = e;
  if (!isStandalone()) $("install").hidden = false;
});
$("install").addEventListener("click", function () {
  if (!deferred) return;
  deferred.prompt();
  deferred.userChoice.then(function () { deferred = null; $("install").hidden = true; });
});
window.addEventListener("appinstalled", function () { deferred = null; $("install").hidden = true; toast("Η εφαρμογή εγκαταστάθηκε"); });
if (isStandalone()) $("install").hidden = true;
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
